<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f6f8;color:#202733;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e3e7ec;border-radius:12px">
          <tr><td style="padding:28px">
            <p style="margin:0 0 22px;font-size:18px;font-weight:700">DialDesk</p>
            <h1 style="font-size:22px;line-height:1.3">Confirm your new email</h1>
            <p style="font-size:15px;line-height:1.6">Confirm the change to {{ .NewEmail }} for your DialDesk account.</p>
            <p style="margin:24px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 18px;border-radius:8px;background:#6657e8;color:#fff;text-decoration:none;font-weight:700">Confirm new email</a></p>
            <p style="font-size:13px;line-height:1.5;color:#626b78">If you did not request this change, secure your account at <a href="{{ .SiteURL }}">{{ .SiteURL }}</a>.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>

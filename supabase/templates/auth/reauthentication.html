<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f6f8;color:#202733;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e3e7ec;border-radius:12px">
          <tr><td style="padding:28px">
            <p style="margin:0 0 22px;font-size:18px;font-weight:700">DialDesk</p>
            <h1 style="font-size:22px;line-height:1.3">Verify it is you</h1>
            <p style="font-size:15px;line-height:1.6">Enter this one-time code to continue with your account change:</p>
            <p style="margin:24px 0;font-size:28px;font-weight:700;letter-spacing:5px">{{ .Token }}</p>
            <p style="font-size:13px;line-height:1.5;color:#626b78">Do not share this code. If you did not request it, you can ignore this message.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
